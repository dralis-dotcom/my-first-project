name: Build Android APK

# Builds an installable Android APK of the MemoryMaster mobile app.
# Download it from the run page: Artifacts -> memorymaster-apk.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'MemoryMasterMobile/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'MemoryMasterMobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: 1
    defaults:
      run:
        working-directory: MemoryMasterMobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MemoryMasterMobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: MemoryMasterMobile/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: memorymaster-apk
          path: MemoryMasterMobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
